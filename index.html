<!doctype html>

<body>

    <label for="usuario"> Usuário: </label>

    <label for="email">Email:</label>
    <input id="email" type="email"/>

    <label for="foto">Foto de Perfil:</label>
    <input id="foto" type="file" accept="image/png"/>

    <label> Matutino <input name="turno" type="radio"/></label>
    <label> Vespetino <input name="turno" type="radio"/></label>
    <label> Noturno <input name="turno" type="radio"/></label>

    </label>
