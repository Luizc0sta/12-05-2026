<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
    <link rel="stylesheet" href="Atividade01.style.css">
</head>

<body>

<form>

    <label for="nome">Nome Completo:</label>
    <input id="nome" type="text"/>

    <label for="email">Email:</label>
    <input id="email" type="email"/>

    <label for="senha">Senha:</label>
    <input id="senha" type="password"/>

    <label for="idade">Idade:</label>
    <input id="idade" type="number"/>

    <label for="data">Data de Nascimento:</label>
    <input id="data" type="date"/>

    <p>Gênero:</p>

    <label>Masculino <input id="masc" name="genero" type="radio"></label>
    <label>Feminino <input id="fem" name="genero" type="radio"></label>
    <label>Outros <input id="outros" name="genero" type="radio"></label>




    <p>Turnos Disponíveis:</p>

   <label>Matutino<input type="checkbox"></label>
    <label>Vespetino<input type="checkbox"></label>
    <label>Noturno<input type="checkbox"></label>



    <label for="cor">Cor destaque:</label>
    <input id="cor" name="cor" type="color"/>

</form>

</body>

</html>
